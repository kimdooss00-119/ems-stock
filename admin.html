<script>

const uid=()=>Math.random().toString(36).slice(2,9),p2=n=>String(n).padStart(2,'0');

const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dleft=e=>Math.round((new Date(e+'T00:00:00')-new Date(ymd(new Date())+'T00:00:00'))/864e5);

if(!S||!S.items)S={centers:[],items:[],batches:[],allocs:[],lots:[]};

 if(CLOUD){if(CN.some(n=>Cloud.push(n,S[n])===false))alert('아직 서버에서 데이터를 받는 중입니다. 잠시 뒤 다시 시도하세요.');return}

/* ---------- 클라우드 (Firebase) 연동 ---------- */
const FB_CFG={apiKey:"AIzaSyBnusgNeBvlhoZQquf4Sr08E5vqV_G8NV8",authDomain:"ems-stock-277e5.firebaseapp.com",projectId:"ems-stock-277e5",storageBucket:"ems-stock-277e5.firebasestorage.app",messagingSenderId:"1026035896295",appId:"1:1026035896295:web:cfc924b78b2dd1a3ea7742"};
const ORG='main',BOOT_ADMIN='admin@test.com';
const Cloud=(()=>{
 let auth=null,db=null,cfg={},prev={},ready={},unsubs=[];
 const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
 const strip=o=>{const r=JSON.parse(JSON.stringify(o));delete r.id;return r};
 const mk=(n,x)=>JSON.parse(JSON.stringify(cfg[n].map(strip(x))));
 const api={err:'',onErr:null,
  ok:()=>typeof firebase!=='undefined',
  init(appName){if(db)return true;if(!api.ok())return false;
   const app=firebase.initializeApp(FB_CFG,appName);auth=app.auth();db=app.firestore();
   try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
   return true},
  email:()=>{const u=auth&&auth.currentUser;return u?String(u.email||'').toLowerCase():''},

  onAuth:cb=>auth.onAuthStateChanged(cb),
  col:n=>db.collection('orgs').doc(ORG).collection(n),
  member:()=>db.collection('members').doc(api.email()).get().then(d=>d.exists?d.data():null),
  setMember:(e,d)=>db.collection('members').doc(e.toLowerCase()).set(d),
  delMember:e=>db.collection('members').doc(e.toLowerCase()).delete(),
  fail(m){api.err=m;console.error(m);if(api.onErr)api.onErr(m)},
  watch(name,o){
   cfg[name]={norm:o.norm||(x=>x),map:o.map||(x=>x)};prev[name]=new Map();ready[name]=false;
   const ref=o.q?o.q(api.col(name)):api.col(name);
   unsubs.push(ref.onSnapshot(s=>{
    const arr=[],m=new Map();
    s.forEach(d=>{const x=cfg[name].norm(Object.assign({},d.data(),{id:d.id}));arr.push(x);m.set(d.id,stable(mk(name,x)))});
    prev[name]=m;ready[name]=true;o.cb(arr)
   },e=>api.fail('읽기 실패('+name+'): '+e.message)))},
  watchDoc(name,id,cb){unsubs.push(api.col(name).doc(id).onSnapshot(d=>cb(d.exists?d.data():null),e=>api.fail('읽기 실패('+name+'): '+e.message)))},
  watchMembers(cb){unsubs.push(db.collection('members').where('org','==',ORG).onSnapshot(s=>{const m={};s.forEach(d=>{m[d.id]=d.data()});cb(m)},e=>api.fail('읽기 실패(members): '+e.message)))},
  isReady:n=>!!ready[n],
  push(name,arr,o){
   o=o||{};if(!ready[name])return false;
   const sets=[],dels=[],cur=new Map();
   arr.forEach(x=>{const d=mk(name,x),s=stable(d);cur.set(x.id,s);if(prev[name].get(x.id)!==s)sets.push([x.id,d])});
   if(!o.noDelete)prev[name].forEach((s,id)=>{if(!cur.has(id))dels.push(id)});
   if(!sets.length&&!dels.length)return true;
   sets.forEach(p=>prev[name].set(p[0],cur.get(p[0])));dels.forEach(id=>prev[name].delete(id));
   const ops=sets.map(p=>[0,p[0],p[1]]).concat(dels.map(id=>[1,id])),ref=api.col(name);
   for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(p=>p[0]?b.delete(ref.doc(p[1])):b.set(ref.doc(p[1]),p[2]));b.commit().catch(e=>api.fail('저장 실패('+name+'): '+e.message))}
   return true},
  stop(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];ready={};prev={};cfg={}}
 };
 return api})();
const loginErr=e=>{const c=e&&e.code||'';return /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'이메일 또는 비밀번호가 맞지 않습니다.':c==='auth/network-request-failed'?'네트워크 연결을 확인하세요.':c==='auth/too-many-requests'?'시도가 너무 많습니다. 잠시 뒤에 다시 하세요.':'로그인 실패: '+((e&&e.message)||e)};

let pg='dash',q='',fc='',note='',lc='';
const sched=()=>{clearTimeout(rtm);rtm=setTimeout(()=>{const a=document.activeElement;if(a&&a.id==='sq'){if(pg==='dash')drawTb();return}if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName||''))return;render()},150)};
const lg=m=>{const e=$('#lg');if(e)e.style.display=m===false?'none':'flex';if(typeof m==='string'&&$('#lm'))$('#lm').textContent=m};
function startCloud(){
 CLOUD=true;S={centers:[],items:[],batches:[],allocs:[],lots:[]};LG=[];
 const lotN=x=>{x.date=x.date||x.inDate||'';if(x.rec==null)x.rec=x.qty;return x};
 CN.forEach(n=>Cloud.watch(n,{norm:n==='lots'?lotN:null,cb:a=>{S[n]=a;sched()}}));
 Cloud.watch('logs',{q:c=>c.orderBy('ts','desc').limit(300),cb:a=>{LG=a;sched()}});
 Cloud.watchMembers(m=>{MEM=m;sched()});
 Cloud.onErr=m=>{sched()};
 lg(false);render()}
async function afterAuth(u){
 if(!u){S={centers:[],items:[],batches:[],allocs:[],lots:[]};CLOUD=false;lg('');render();return}
 const em=Cloud.email();let m=null;
 try{m=await Cloud.member()}catch(e){}
 if(em===BOOT_ADMIN){try{await Cloud.setMember(em,{role:'admin',org:ORG})}catch(e){}m={role:'admin',org:ORG}}
 if(!m||m.role!=='admin'){await Cloud.logout();lg(!m?'이 계정은 등록되어 있지 않습니다. 관리자에게 문의하세요.':'센터 계정입니다. 센터 계정은 휴대폰 앱에서 사용하세요.');return}
 startCloud()}
function doLogin(){const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p)return lg('이메일과 비밀번호를 입력하세요.');
 lg('로그인 중…');Cloud.login(e,p).catch(x=>lg(loginErr(x)))}
function doLogout(){if(confirm('로그아웃할까요?'))Cloud.logout()}
function useLocal(){try{localStorage.setItem(MK,'local')}catch(e){}location.reload()}
function goLogin(){try{localStorage.removeItem(MK)}catch(e){}location.reload()}
function csBox(){const e=$('#cs');if(!e)return;
 e.innerHTML=CLOUD?`<div class="mu">☁ 서버 연결됨<br>${esc(Cloud.email())}</div>${Cloud.err?`<div class="mu" style="color:var(--er)">${esc(Cloud.err)}</div>`:''}<button class="btn s" style="margin-top:6px;padding:4px 10px;min-height:30px" onclick="doLogout()">로그아웃</button>`
 :`<div class="mu">로컬 모드 (이 PC에만 저장)</div><button class="btn s" style="margin-top:6px;padding:4px 10px;min-height:30px" onclick="goLogin()">서버 로그인</button>`}
let vf='',vs='',curCats=[];
const U={rows:null,h:0,map:{name:0,spec:-1,total:-1},cm:{},name:'',excl:false,H:null,aiNote:'',busy:'',wb:null,sheet:'',sheets:{},order:[],sel:{}};
const hdr=()=>U.H||((U.rows||[])[U.h]||[]).map(x=>String(x).trim());
const num=v=>{if(typeof v==='number')return v;const m=String(v==null?'':v).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?Number(m[0]):0};
let gUsed='';
const nameOf=(a,id)=>(S[a].find(x=>x.id===id)||{name:'?'}).name;
function stat(i,c){const a=S.allocs.filter(x=>x.itemId===i&&(!c||x.centerId===c)).reduce((s,x)=>s+x.qty,0),L=S.lots.filter(x=>x.itemId===i&&(!c||x.centerId===c));
 return {a,r:L.reduce((s,x)=>s+x.rec,0),s:L.reduce((s,x)=>s+x.qty,0)}}
const alerts=()=>S.lots.filter(l=>l.exp&&l.qty>0&&dleft(l.exp)<=WARN).sort((a,b)=>a.exp<b.exp?-1:1);

const vis=s=>[...String(s||'')].reduce((n,c)=>n+(c.charCodeAt(0)>127?2:1),0);
const shortN=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n)+'…':s};
const catLabel=c=>c==='__none'?'분류 없음':c;
// 업로드한 파일 단위로 묶기 (같은 업로드의 시트들은 한 파일)
const fkey=b=>b.up||('l:'+(b.file||b.label));
function files(){
 const used=new Set(S.allocs.map(a=>a.batch)),m=[],seen={};
 S.batches.forEach(b=>{if(!used.has(b.id))return;const k=fkey(b);if(!seen[k]){seen[k]={key:k,name:b.file||b.label,ids:[],date:b.date,inDate:b.inDate||b.date};m.push(seen[k])}seen[k].ids.push(b.id)});
 const cn={},ix={};m.forEach(f=>cn[f.name]=(cn[f.name]||0)+1);
 m.forEach(f=>{if(cn[f.name]>1){ix[f.name]=(ix[f.name]||0)+1;f.name+=' ('+ix[f.name]+')'}});
 return m;
}
function scope(){const fl=files(),f=fl.find(x=>x.key===vf);if(vf&&!f)vf='';return {fl,f,ids:f?new Set(f.ids):null}}
// 로트가 어느 파일(배정 묶음)에서 왔는지: 자동 입고 로트는 batch 또는 allocId로 연결
let AB=new Map(),SPLIT=true;
let BS=new Map();
const buildAB=()=>{AB=new Map(S.allocs.map(a=>[a.id,a.batch]));BS=new Map(S.batches.map(b=>[b.id,b.sheet||'']))};
const itemCats=(i,ids)=>{const s=new Set();S.allocs.forEach(a=>{if(a.itemId===i.id&&(!ids||ids.has(a.batch)))s.add(BS.get(a.batch)||i.cat||'')});if(!s.size&&!ids)s.add(i.cat||'');return [...s].map(c=>c||'__none')};
const catTxt=(i,ids)=>itemCats(i,ids).filter(c=>c!=='__none').join(', ');
const batchOf=l=>l.batch||AB.get(l.allocId)||'';
function sc(i,c,ids){if(!ids)return stat(i,c);
 const a=S.allocs.filter(x=>x.itemId===i&&(!c||x.centerId===c)&&ids.has(x.batch)).reduce((s,x)=>s+x.qty,0),
 L=S.lots.filter(x=>x.itemId===i&&(!c||x.centerId===c)&&ids.has(batchOf(x)));
 return {a,r:L.reduce((s,x)=>s+(x.rec==null?x.qty:x.rec),0),s:L.reduce((s,x)=>s+x.qty,0)}}
// 표에 나열할 행: 총 합계에서 파일별로 나눠 보면 같은 품목도 파일마다 한 줄씩
function buildRows(its,fl,ids,tot,split,f){
 const out=[],inF=new Set(fl.flatMap(x=>x.ids));
 its.forEach(i=>{
  if(!tot){out.push({i,ids,f,k:fl.indexOf(f)});return}
  if(!split||!fl.length){out.push({i,ids:null,f:null,k:-1});return}
  let any=false;
  fl.forEach((x,k)=>{if(S.allocs.some(a=>a.itemId===i.id&&x.ids.includes(a.batch))){out.push({i,ids:new Set(x.ids),f:x,k});any=true}});
  const un=S.lots.filter(l=>l.itemId===i.id&&!inF.has(batchOf(l)));
  if(un.length){out.push({i,ids:new Set(un.map(batchOf)),f:null,k:-2,un:true});any=true}
  if(!any)out.push({i,ids:null,f:null,k:-1});
 });return out}
function setVF(k){const fl=files();vf=k<0?'':((fl[k]||{}).key||'');vs='';render()}
function setVS(k){vs=k<0?'':(curCats[k]||'');render()}

}
function renSheet(){
 if(!vs)return;const old=vs==='__none'?'':vs,v=prompt('시트(분류) 이름 변경'+(vs==='__none'?' — 분류가 없는 품목에 새 분류를 붙입니다':''),old);if(v===null)return;const nm=v.trim();if(!nm)return alert('이름을 입력하세요.');

const APROMPT=`아래는 소방서 구급 소모품 "배정 목록" 엑셀의 위쪽 일부입니다. 첫 열은 행 번호(1부터)이고, 나머지 열 머리는 엑셀 열 문자(A, B, C…)입니다. 병합된 칸은 첫 칸에만 값이 있고 나머지는 비어 있을 수 있으며, 머리글이 두 줄 이상일 수 있습니다.
구조를 판단해 JSON으로만 답하세요. 키:
- data_start_row: 첫 번째 품목 데이터가 시작하는 행 번호(숫자)
- name_col: 품명이 있는 열 문자
- spec_col: 규격이 있는 열 문자(없으면 null)
- total_col: 총수량(합계) 열 문자(없으면 null)
- center_cols: 센터(부서)별로 배부할 수량이 들어 있는 열 목록 [{"col":"열 문자","center":"센터 또는 부서 이름"}]. 총수량·합계·비고 열은 제외
- notes: 이상한 점이나 확인이 필요한 점(한 문장, 없으면 null)
추측하지 말고 보이는 내용만 근거로 하세요. 품명과 규격이 한 칸에 같이 있으면 spec_col은 null로 하고 notes에 적으세요.`;
async function aiGuess(){
 const R=U.rows.slice(0,40),cols=Math.min(30,Math.max(1,...R.map(r=>r.length))),L=['행\t'+Array.from({length:cols},(_,i)=>XLSX.utils.encode_col(i)).join('\t')];
 R.forEach((r,k)=>L.push((k+1)+'\t'+Array.from({length:cols},(_,i)=>String(r[i]==null?'':r[i]).replace(/[\t\r\n]+/g,' ').slice(0,25)).join('\t')));
 const d=JSON.parse((await gcall(APROMPT+'\n\n'+L.join('\n'))).replace(/```json|```/g,'').trim());
 const ci=s=>s&&/^[A-Za-z]{1,2}$/.test(String(s).trim())?XLSX.utils.decode_col(String(s).trim().toUpperCase()):-1;
 const m={name:ci(d.name_col),spec:ci(d.spec_col),total:ci(d.total_col)},cc=(Array.isArray(d.center_cols)?d.center_cols:[]).filter(x=>x&&ci(x.col)>=0);
 if(m.name<0||!cc.length)throw new Error('구조를 판단하지 못했습니다');
 const st=Math.max(1,Math.round(+d.data_start_row)||2);U.map=m;U.h=st-2;
 const nc=Math.max(cols,...U.rows.map(r=>r.length)),hr=[U.h-1,U.h].filter(i=>i>=0);
 U.H=Array.from({length:nc},(_,i)=>hr.map(k=>String(U.rows[k][i]==null?'':U.rows[k][i]).trim()).filter(Boolean).join(' '));
 U.cm={};U.H.forEach((x,i)=>U.cm[i]='__skip');
 cc.forEach(x=>{const i=ci(x.col),nm=String(x.center||U.H[i]||'').trim();U.H[i]=nm;
  const c=S.centers.find(c=>ck(c.name)&&ck(c.name)===ck(nm))||S.centers.find(c=>ck(c.name)&&ck(nm)&&(ck(nm).includes(ck(c.name))||ck(c.name).includes(ck(nm))));U.cm[i]=c?c.id:'__new'});
 U.aiNote='AI 분석 완료'+(d.notes?': '+d.notes:'')+' 아래에서 맞게 읽었는지 확인하세요.';
}

async function gcall(text,ms){
 const c=gcfg();if(!c.key)throw new Error('API 키가 없습니다');
 if(!/^[\x21-\x7E]+$/.test(c.key))throw new Error('API 키 칸에 한글, 공백, 보이지 않는 문자가 섞여 있습니다. 키 칸을 비우고 AI Studio에서 키를 다시 복사해 붙여넣으세요.');
 const ml=[c.model||'gemini-flash-latest','gemini-2.5-flash','gemini-flash-lite-latest'].filter((m,i,a)=>a.indexOf(m)===i);let last;
 for(const m of ml)for(let t=0;t<2;t++){try{return await gone(m,text,ms)}catch(e){last=e;
  const busy=e.st===503||e.st===429||e.st===500||/high demand|overloaded|unavailable/i.test(e.message);
  if(e.st===404)break;if(!busy)throw e;if(t===0)await new Promise(r=>setTimeout(r,2500))}}
 throw last}

function guess(keepH){
 const R=U.rows;let h=U.h;U.H=null;
 if(!keepH){h=0;for(let i=0;i<Math.min(R.length,15);i++)if(R[i].filter(c=>String(c).trim()!=='').length>=3){h=i;break}}
 U.h=h;const H=(R[h]||[]).map(c=>String(c).replace(/\s+/g,'')),f=re=>H.findIndex(x=>re.test(x));
 const m={name:Math.max(0,f(/품명|품목|명칭|물품|물자/)),spec:f(/규격|사양|모델/),total:f(/총수량|총량|합계|총계|^계$|^총$/)};U.map=m;U.cm={};
 H.forEach((x,i)=>{if(!x)return;const hn=x,isD=i!==m.name&&i!==m.spec&&i!==m.total&&R.slice(h+1).some(r=>r[i]!==''&&!isNaN(Number(r[i])));

  U.cm[i]=!isD?'__skip':c?c.id:'__new'});

function parsed(){

function regSheet(label,cat,file,up){
 const P=parsed().filter(x=>!(U.excl&&x.warn));if(!P.length)return null;
 const cid={},H=hdr();
 for(const c of Object.keys(U.cm).map(Number)){const v=U.cm[c];if(v==='__skip')continue;
  if(v==='__new'){const nm=String(H[c]).trim();let e=S.centers.find(x=>ck(nm)&&ck(x.name)===ck(nm))||S.centers.find(x=>norm(x.name)===norm(nm));if(!e){e={id:uid(),name:nm};S.centers.push(e)}cid[c]=e.id}else cid[c]=v}
 const b={id:uid(),label,date:ymd(new Date()),inDate:U.inDate||ymd(new Date()),file,up,sheet:cat||''};S.batches.push(b);
 let ni=0,ei=0,na=0;
 P.forEach(x=>{let it=S.items.find(i=>norm(i.name)===norm(x.n)&&norm(i.spec)===norm(x.sp));
  if(it){ei++;if(!it.cat&&cat)it.cat=cat}else{it={id:uid(),name:x.n,spec:x.sp,cat:cat||''};S.items.push(it);ni++}

 return {ni,ei,na};
}

 Promise.all(ps).then(()=>{note=v?'“'+c.name+'”에 '+v+' 계정을 연결했습니다.':'계정 연결을 해제했습니다.';render()}).catch(e=>alert('계정 연결 실패: '+e.message))}
function addC(){const n=$('#nc').value.trim();if(!n)return;if(S.centers.some(c=>norm(c.name)===norm(n)))return alert('같은 이름의 센터가 있습니다.');S.centers.push({id:uid(),name:n});save();render()}
function renC(id){const c=S.centers.find(x=>x.id===id),n=prompt('센터 이름',c.name);if(n&&n.trim()){c.name=n.trim();save();render()}}
function delC(id){if(S.allocs.some(a=>a.centerId===id)||S.lots.some(l=>l.centerId===id))return alert('배정이나 재고 기록이 있는 센터는 삭제할 수 없습니다.');S.centers=S.centers.filter(c=>c.id!==id);save();render()}
const LT={in:'입고',out:'출고',fix:'수정'};
function logsV(){
 if(!CLOUD)return '<h2>입출고 이력</h2><div class="box mu">서버에 로그인하면 센터 휴대폰 앱의 입고·출고 기록이 여기에 표시됩니다.</div>';
 const L=LG.filter(g=>!lc||g.centerId===lc);
 return `<h2>입출고 이력</h2><div class="row"><select onchange="lc=this.value;render()"><option value="">모든 센터</option>${S.centers.map(c=>`<option value="${c.id}" ${lc===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span class="mu">최근 300건까지 표시합니다.</span></div>
 <div class="wrap"><table><tr><th>일시</th><th>센터</th><th>구분</th><th>품목</th><th>규격</th><th class="c">수량</th><th>유효기간</th><th>담당자</th><th>메모</th></tr>${L.map(g=>{const i=S.items.find(x=>x.id===g.itemId)||{};return `<tr${g.voided?' style="opacity:.5;text-decoration:line-through"':''}><td>${esc(g.ts)}</td><td>${esc(nameOf('centers',g.centerId))}</td><td>${LT[g.type]||esc(g.type)}</td><td>${esc(i.name||'?')}</td><td>${esc(i.spec||'')}</td><td class="c">${g.d>0?'+':''}${g.d}</td><td>${esc(g.exp||'')}</td><td>${esc(g.user)}</td><td style="white-space:normal">${esc(g.note||'')}</td></tr>`}).join('')||'<tr><td colspan="9" class="mu">기록이 없습니다.</td></tr>'}</table></div>`}
function alertsV(){const L=alerts();
 return `<h2>알림 · 유효기간</h2><div class="wrap"><table><tr><th>센터</th><th>품목</th><th>규격</th><th>유효기간</th><th>상태</th><th class="c">남은 수량</th></tr>${L.map(l=>{const d=dleft(l.exp),i=S.items.find(x=>x.id===l.itemId)||{};return `<tr><td>${esc(nameOf('centers',l.centerId))}</td><td>${esc(i.name)}</td><td>${esc(i.spec)}</td><td>${l.exp}</td><td>${d<0?'<span class="tag t-er">만료</span>':'<span class="tag t-wn">D-'+d+'</span>'}</td><td class="c">${l.qty}</td></tr>`}).join('')||'<tr><td colspan="6" class="mu">임박하거나 만료된 재고가 없습니다.</td></tr>'}</table></div>`}
function sim(){
 const co=`<option value="">센터 선택</option>${S.centers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}`,io=`<option value="">품목 선택</option>${S.items.map(i=>`<option value="${i.id}">${esc(i.name)} ${esc(i.spec)}</option>`).join('')}`;
 return `<h2>시험 입력 (센터 앱 대신)</h2><p class="mu">실제로는 센터 휴대폰 앱에서 입력됩니다. 관리자 화면이 어떻게 바뀌는지 확인하려고 여기서 대신 입력해 볼 수 있어요.</p>
 <div class="box"><b>수령(입고)</b><div class="row" style="margin-top:8px"><select id="s1">${co}</select><select id="s2">${io}</select><input id="s3" type="date"><input id="s4" type="number" min="1" placeholder="수량" style="width:90px"><button class="btn" onclick="simIn()">수령 입력</button></div></div>
 <div class="box" style="margin-top:12px"><b>출고(사용)</b><div class="row" style="margin-top:8px"><select id="o1">${co}</select><select id="o2">${io}</select><input id="o4" type="number" min="1" placeholder="수량" style="width:90px"><button class="btn" onclick="simOut()">출고 입력</button></div><span class="mu">유효기간이 빠른 재고부터 차감합니다.</span></div>`}
function simIn(){const c=$('#s1').value,i=$('#s2').value,e=$('#s3').value,q=parseInt($('#s4').value,10);if(!c||!i||!e||!(q>0))return alert('센터, 품목, 유효기간, 수량을 모두 입력하세요.');
 S.lots.push({id:uid(),itemId:i,centerId:c,exp:e,rec:q,qty:q,date:ymd(new Date())});save();note='수령 입력 완료';pg='dash';render()}
function simOut(){const c=$('#o1').value,i=$('#o2').value;let q=parseInt($('#o4').value,10);if(!c||!i||!(q>0))return alert('센터, 품목, 수량을 입력하세요.');
 const L=S.lots.filter(l=>l.itemId===i&&l.centerId===c&&l.qty>0).sort((a,b)=>a.exp<b.exp?-1:1);if(L.reduce((s,l)=>s+l.qty,0)<q)return alert('재고가 부족합니다.');
 for(const l of L){const t=Math.min(l.qty,q);l.qty-=t;q-=t;if(!q)break}save();note='출고 입력 완료';pg='dash';render()}
function demo(){
 S={centers:S.centers,items:[],batches:[],allocs:[],lots:[]};vf='';vs='';
 const cn=['중앙','동부','서부','남부','북부','신도시'].map(n=>{n+='안전센터';let c=S.centers.find(x=>x.name===n);if(!c){c={id:uid(),name:n};S.centers.push(c)}return c});
 const it=[['멸균 거즈','10x10cm','소모품',[60,50,50,40,40,60],[20,20,20,20,20,20]],['탄력 붕대','7.5cm','소모품',[30,30,20,20,20,30],null],['일회용 장갑','M 100매','소모품',[10,10,10,8,8,10],[5,5,5,5,5,5]],['생리식염수','500ml','의약품',[20,20,16,16,16,20],[10,10,10,10,10,10]],['산소마스크','성인용','소모품',[8,8,6,6,6,8],null],['삼각건','표준','소모품',[10,10,10,10,10,10],null]].map(a=>({id:uid(),name:a[0],spec:a[1],cat:a[2],q1:a[3],q2:a[4]}));
 S.items=it.map(a=>({id:a.id,name:a.name,spec:a.spec,cat:a.cat}));
 const ups={'샘플 1차 배정':uid(),'샘플 2차 배정':uid()},bt={};
 const getB=(nm,cat)=>bt[nm+cat]||(bt[nm+cat]=(()=>{const b={id:uid(),label:nm+'_'+cat,date:ymd(new Date()),file:nm,up:ups[nm],sheet:cat};S.batches.push(b);return b})());
 it.forEach((a,k)=>cn.forEach((c,j)=>{const a1={id:uid(),batch:getB('샘플 1차 배정',a.cat).id,itemId:a.id,centerId:c.id,qty:a.q1[j]};S.allocs.push(a1);const l1=autoLot(a1,addD(-20));
  if((j+k)%3!==0){l1.exp=addD([-10,40,300,500][(j+k)%4]);l1.qty=Math.max(0,l1.rec-Math.round(l1.rec*.15))}S.lots.push(l1);
  if(a.q2){const a2={id:uid(),batch:getB('샘플 2차 배정',a.cat).id,itemId:a.id,centerId:c.id,qty:a.q2[j]};S.allocs.push(a2);S.lots.push(autoLot(a2,addD(-3)))}}));
 save();note='샘플 데이터를 넣었습니다.';render()}

const PG={dash:['현황',dash],upload:['엑셀 업로드',upload],centers:['센터 관리',centers],alerts:['알림',alertsV],logs:['입출고 이력',logsV],sim:['시험 입력',sim],item:['품목 수정',itemV]};
/* ---------- 초기화 · 품목 수량 수정 ---------- */
function resetData(all){
 const n='품목 '+S.items.length+'개, 배정 '+S.allocs.length+'건, 재고 기록 '+S.lots.length+'건'+(all?', 센터 '+S.centers.length+'개':'');
 if(!confirm('다음 내용을 모두 지웁니다.\n\n'+n+'\n\n'+(all?'':'센터 목록은 남겨 둡니다.\n')+'되돌릴 수 없습니다. 지우기 전에 “엑셀로 내려받기”로 백업해 두셨나요?\n\n계속할까요?'))return;
 S.items=[];S.allocs=[];S.lots=[];S.batches=[];if(all)S.centers=[];
 fc='';q='';cc='';vf='';vs='';save();note=all?'전체를 초기화했습니다.':'현황을 초기화했습니다. 센터 목록은 그대로입니다.';pg='dash';render();
}
let ei='';
function editItem(id){ei=id;pg='item';note='';render()}
const intV=id=>{const e=$(id),v=e?String(e.value).trim():'',n=Number(v);return v!==''&&Number.isInteger(n)&&n>=0?n:null};
function itemV(){
 const it=S.items.find(i=>i.id===ei);if(!it){pg='dash';return dash()}
 const al=S.allocs.filter(a=>a.itemId===ei),lo=S.lots.filter(l=>l.itemId===ei).sort((a,b)=>a.exp<b.exp?-1:1);
 const bl=b=>(S.batches.find(x=>x.id===b)||{}).label||'';
 const co=sel=>S.centers.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
 const t=stat(ei);
 return `${note?`<div class="msg">${esc(note)}</div>`:''}<h2>품목 수정 · ${esc(it.name)} ${esc(it.spec)}</h2>
 <div class="row"><button class="btn s" onclick="pg='dash';note='';render()">← 현황으로</button><span class="mu">전체 배정 ${t.a} · 수령 ${t.r} · 재고 ${t.s}</span></div>
 <div class="box"><b>품목 정보</b><div class="g2"><div><label class="f">품명</label><input id="m1" value="${esc(it.name)}" style="width:100%"></div><div><label class="f">규격</label><input id="m2" value="${esc(it.spec)}" style="width:100%"></div><div><label class="f">분류</label><input id="m3" value="${esc(it.cat||'')}" style="width:100%"></div></div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="saveItem()">품목 정보 저장</button><button class="btn s" onclick="delItem()">품목 삭제</button></div></div>
 <h3 style="margin:18px 0 8px">배정 수량</h3>
 <div class="wrap"><table><tr><th>배정 이름</th><th>센터</th><th>수량</th><th></th></tr>${al.map(a=>`<tr><td>${esc(bl(a.batch))}</td><td>${esc(nameOf('centers',a.centerId))}</td><td><input id="aq_${a.id}" type="number" min="0" inputmode="numeric" value="${a.qty}" style="width:90px"></td><td><button class="btn s" onclick="saveAlloc('${a.id}')">저장</button> <button class="btn s" onclick="delAlloc('${a.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">배정이 없습니다.</td></tr>'}
 <tr><td class="mu">새 배정 추가</td><td><select id="nac"><option value="">센터 선택</option>${co('')}</select></td><td><input id="naq" type="number" min="1" inputmode="numeric" placeholder="수량" style="width:90px"></td><td><button class="btn" onclick="addAlloc()">추가</button></td></tr></table></div>
 <h3 style="margin:18px 0 8px">수령 · 재고 수량</h3>
 <div class="wrap"><table><tr><th>센터</th><th>유효기간</th><th>수령</th><th>재고</th><th></th></tr>${lo.map(l=>`<tr><td>${esc(nameOf('centers',l.centerId))}</td><td>${esc(l.exp)}</td><td><input id="lr_${l.id}" type="number" min="0" inputmode="numeric" value="${l.rec}" style="width:80px"></td><td><input id="lq_${l.id}" type="number" min="0" inputmode="numeric" value="${l.qty}" style="width:80px"></td><td><button class="btn s" onclick="saveLot('${l.id}')">저장</button> <button class="btn s" onclick="delLot('${l.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="5" class="mu">수령·재고 기록이 없습니다.</td></tr>'}</table></div>
 <p class="mu">수량을 바꾸면 현황 표에 바로 반영됩니다. 이 프로그램은 서버가 없어서 수정 이력은 남지 않으니, 중요한 변경 전에는 엑셀로 내려받아 두세요.</p>`;
}
function saveItem(){
 const it=S.items.find(i=>i.id===ei);if(!it)return;
 const n=$('#m1').value.trim(),sp=$('#m2').value.trim(),ct=$('#m3').value.trim();
 if(!n)return alert('품명을 입력하세요.');
 if(S.items.some(x=>x.id!==it.id&&norm(x.name)===norm(n)&&norm(x.spec)===norm(sp)))return alert('같은 품명·규격의 품목이 이미 있습니다.');
 it.name=n;it.spec=sp;it.cat=ct;save();note='품목 정보를 저장했습니다.';render();
}
function saveAlloc(id){
 const a=S.allocs.find(x=>x.id===id),n=intV('#aq_'+id);if(!a)return;
 if(n===null)return alert('수량은 0 이상의 정수로 입력하세요.');
 a.qty=n;const al=S.lots.find(l=>l.allocId===id);if(untouched(al)){al.qty=n;al.rec=n}save();note='배정 수량을 저장했습니다.';render();
}
function delAlloc(id){if(!confirm('이 배정을 삭제할까요?'))return;S.allocs=S.allocs.filter(a=>a.id!==id);S.lots=S.lots.filter(l=>!(l.allocId===id&&untouched(l)));save();note='배정을 삭제했습니다.';render()}
function addAlloc(){
 const c=$('#nac').value,n=intV('#naq');
 if(!c)return alert('센터를 선택하세요.');
 if(n===null||n<1)return alert('수량은 1 이상의 정수로 입력하세요.');
 let b=S.batches.find(x=>x.label==='수동 추가');if(!b){b={id:uid(),label:'수동 추가',date:ymd(new Date())};S.batches.push(b)}
 const na={id:uid(),batch:b.id,itemId:ei,centerId:c,qty:n};S.allocs.push(na);S.lots.push(autoLot(na));save();note='배정을 추가했습니다.';render();
}
function saveLot(id){
 const l=S.lots.find(x=>x.id===id),r=intV('#lr_'+id),n=intV('#lq_'+id);if(!l)return;
 if(r===null||n===null)return alert('수량은 0 이상의 정수로 입력하세요.');
 if(n>r&&!confirm('재고('+n+')가 수령('+r+')보다 많습니다. 그래도 저장할까요?'))return;
 l.rec=r;l.qty=n;save();note='수령·재고 수량을 저장했습니다.';render();
}
function delLot(id){if(!confirm('이 수령·재고 기록을 삭제할까요?'))return;S.lots=S.lots.filter(l=>l.id!==id);save();note='기록을 삭제했습니다.';render()}
function delItem(){
 const it=S.items.find(i=>i.id===ei);if(!it)return;
 if(S.lots.some(l=>l.itemId===ei&&(l.qty>0||l.rec>0)))return alert('수령·재고 기록이 남아 있는 품목은 삭제할 수 없습니다. 아래 수령·재고 기록을 먼저 삭제하세요.');
 if(!confirm('“'+it.name+'” 품목과 그 배정을 모두 삭제할까요? 되돌릴 수 없습니다.'))return;
 S.items=S.items.filter(i=>i.id!==ei);S.allocs=S.allocs.filter(a=>a.itemId!==ei);S.lots=S.lots.filter(l=>l.itemId!==ei);
 save();ei='';pg='dash';note='품목을 삭제했습니다.';render();
}
function goP(k){pg=k;note='';if(k==='upload')U.rows=null;render()}
let theme='auto';try{theme=localStorage.getItem('emsTheme')||'auto'}catch(e){}
function applyTheme(){const r=document.documentElement;if(r&&r.setAttribute){if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme)}
 const e=$('#th');if(e)e.innerHTML=[['light','☀ 라이트'],['dark','🌙 다크'],['auto','자동']].map(a=>`<button class="btn s ${theme===a[0]?'on':''}" style="padding:4px 6px;min-height:30px;font-size:12px;justify-content:center" onclick="setTheme('${a[0]}')">${a[1]}</button>`).join('')}
function setTheme(t){theme=t;try{localStorage.setItem('emsTheme',t)}catch(e){}applyTheme()}
function render(){applyTheme();csBox();
 $('#n').innerHTML=Object.keys(PG).filter(k=>k!=='item').map(k=>`<button class="${k===pg||(pg==='item'&&k==='dash')?'on':''}" onclick="goP('${k}')">${PG[k][0]}${k==='alerts'&&alerts().length?`<span class="tag t-wn">${alerts().length}</span>`:''}</button>`).join('');
 $('#v').innerHTML=PG[pg][1]();
}
render();
if(MODE!=='local'){lg('');if(!Cloud.init('admin')){lg('서버 연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 로컬 모드를 사용하세요.')}else Cloud.onAuth(afterAuth)}
</script></body></html>
